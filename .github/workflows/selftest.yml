# Self-tests for the reusable Go CI: GREEN fixture passes, RED fixtures fail.
# Runs on push/PR to main. Pins actions by SHA, least-privilege, timeouts.
name: selftest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
      - name: GREEN vet+test+gofumpt-shape
        run: |
          cd selftest/good
          go vet ./...
          go test ./... -count=1
          test -z "$(gofmt -l .)"
      - name: GREEN whole-repo lint under org config
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          cp ../../.golangci.yml .golangci.yml
          golangci-lint run ./...
          rm .golangci.yml
        working-directory: selftest/good

  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
      - name: RED vet fixture must fail
        run: |
          cd selftest/bad-vet
          if go vet ./...; then echo "FAIL: bad-vet passed vet"; exit 1; fi
      - name: RED format fixture must be flagged
        run: |
          test -n "$(gofmt -l selftest/bad-fmt/)"
      - name: RED 500-line cap fixture must trip
        run: |
          ./selftest/over-cap/gen.sh
          lines=$(wc -l < selftest/over-cap/gen.go)
          echo "gen.go lines=$lines"
          test "$lines" -gt 500
      - name: ci-complete aggregation logic must fail on failed lanes
        # Regression guard: the aggregator compares v["result"] per job.
        # History: comparing whole job OBJECTS to "failure" never matched
        # (false-green, run 40598497783); needs.*.result is a bare ARRAY
        # that kills green runs on AttributeError. Runs the exact snippet
        # shape from go-collector-ci.yml against canned red/green payloads.
        run: |
          cat > /tmp/agg_check.py <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v.get("result") for k, v in needs.items()
                 if isinstance(v, dict) and v.get("result") in ("failure", "cancelled")}
          if bad:
              print("FAIL:", bad)
              sys.exit(1)
          print("ci-complete: pass (skips allowed)")
          EOF
          NEEDS_JSON='{"lint":{"result":"failure","outputs":{}},"test":{"result":"success","outputs":{}},"race":{"result":"skipped","outputs":{}}}' python3 /tmp/agg_check.py && { echo "FAIL: red payload passed"; exit 1; }
          NEEDS_JSON='{"lint":{"result":"success","outputs":{}},"test":{"result":"success","outputs":{}},"race":{"result":"skipped","outputs":{}}}' python3 /tmp/agg_check.py
          echo "aggregator guard green"

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: shellcheck selftest scripts
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          scandir: selftest
