# Reusable Go collector CI — single-module lane bodies (v2).
# Caller: .github/workflows/ci.yml in each collector repo (thin wrapper with
# paths-filter + job names identical to in-repo implementation).
# Versioned by tag on eshu-hq/.github (v1, v2, then semver); callers pin the
# peeled commit SHA with a version comment, never the mutable tag.
# Stable job names: lint, test, race, shell, image, boundary, govulncheck,
# gosec, actionlint, ci-complete. Only ci-complete is ever required.
# v2 over v1: run-govulncheck/run-gosec/run-actionlint/run-boundary path
# gates; pinned govulncheck (scan-package) and gosec (artifact, never
# blocking, no Security-tab upload so forks stay green); boundary and
# actionlint lanes; image tag/context/extra-command hooks; timeout parity;
# go-version-file instead of a version default; v7 action pins throughout.
name: go-collector-ci (reusable)

on:
  workflow_call:
    inputs:
      module:
        description: Go module path being gated (informational, names artifacts).
        required: false
        default: .
        type: string
      working-directory:
        description: Directory holding go.mod for this module.
        required: false
        default: .
        type: string
      coverage-floor:
        description: Minimum total statement coverage percent; only rises.
        required: false
        default: 0
        type: number
      go-version-file:
        description: setup-go version file, repo-root-relative (reads the toolchain, never drifts).
        required: false
        default: 'go.mod'
        type: string
      run-image:
        description: Run the image lane (repo ships a Dockerfile).
        required: false
        default: false
        type: boolean
      image-tag:
        description: Tag for the built image; empty keeps a bare build.
        required: false
        default: ''
        type: string
      image-context:
        description: Build context directory for the image lane.
        required: false
        default: '.'
        type: string
      image-command:
        description: Extra image validation (seed contract, digest pins); empty skips.
        required: false
        default: ''
        type: string
      run-lint:
        description: Set by caller paths-filter for Go/module changes.
        required: false
        default: true
        type: boolean
      run-test:
        description: Set by caller paths-filter for Go/fixture changes.
        required: false
        default: true
        type: boolean
      run-race:
        description: Set by caller paths-filter for Go/module changes.
        required: false
        default: true
        type: boolean
      run-shell:
        description: Set by caller paths-filter for shell changes.
        required: false
        default: false
        type: boolean
      run-boundary:
        description: Set by caller paths-filter for Go/unclassified/workflow changes.
        required: false
        default: true
        type: boolean
      boundary-command:
        description: Boundary gate (import bans, fail-closed guards); empty skips the lane.
        required: false
        default: ''
        type: string
      run-govulncheck:
        description: Set by caller paths-filter for dependency/workflow changes.
        required: false
        default: true
        type: boolean
      run-gosec:
        description: Set by caller paths-filter for Go/unclassified/workflow changes.
        required: false
        default: true
        type: boolean
      gosec-fail-on-findings:
        description: Fail the lane when findings exist (scheduled runs feed issue filing); PRs stay advisory.
        required: false
        default: false
        type: boolean
      run-actionlint:
        description: Set by caller paths-filter for workflow/shared changes.
        required: false
        default: true
        type: boolean
      golangci-lint-version:
        description: Org golangci-lint pin (exact, never latest).
        required: false
        default: 'v2.12.2'
        type: string
      govulncheck-version:
        description: Org govulncheck pin (exact, never latest).
        required: false
        default: 'v1.9.0'
        type: string
      gosec-version:
        description: Org gosec pin (exact, never latest).
        required: false
        default: 'v2.30.0'
        type: string
      actionlint-version:
        description: actionlint pin (tarball, sha256-checked).
        required: false
        default: '1.7.12'
        type: string
      actionlint-sha256:
        description: Expected sha256 of the actionlint tarball.
        required: false
        default: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        type: string

permissions:
  contents: read

jobs:
  lint:
    if: inputs.run-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ inputs.golangci-lint-version }}
        working-directory: ${{ inputs.working-directory }}
      - name: vet
        run: go vet ./...
        working-directory: ${{ inputs.working-directory }}
      - name: lint (whole repo, no baseline)
        run: golangci-lint run ./...
        working-directory: ${{ inputs.working-directory }}
      - name: format check (gofumpt)
        run: golangci-lint fmt --diff ./...
        working-directory: ${{ inputs.working-directory }}
      - name: tidy check
        run: |
          go mod tidy -diff
          git diff --exit-code -- go.mod go.sum
        working-directory: ${{ inputs.working-directory }}
      - name: 500-line file cap (wc -l, sole static gate)
        run: |
          over=$(find . -name '*.go' -not -path './vendor/*' -exec wc -l {} + | awk '$1 > 500 && $2 != "total" {print}')
          if [ -n "$over" ]; then echo "$over"; echo "FAIL: .go files over 500 lines"; exit 1; fi
        working-directory: ${{ inputs.working-directory }}

  test:
    if: inputs.run-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - name: build
        run: go build ./...
        working-directory: ${{ inputs.working-directory }}
      - name: test
        run: go test ./... -count=1
        working-directory: ${{ inputs.working-directory }}

  race:
    if: inputs.run-race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - name: race + coverprofile
        run: go test ./... -race -count=1 -covermode=atomic -coverprofile=coverage.out
        working-directory: ${{ inputs.working-directory }}
      - name: coverage totals
        run: go tool cover -func=coverage.out | tail -n 30 >> "$GITHUB_STEP_SUMMARY"
        working-directory: ${{ inputs.working-directory }}
      - name: enforce floor
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "total=$total floor=${{ inputs.coverage-floor }}"
          awk -v t="$total" -v f="${{ inputs.coverage-floor }}" 'BEGIN { if (t + 0 < f + 0) { print "FAIL: coverage below floor"; exit 1 } }'
        working-directory: ${{ inputs.working-directory }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ inputs.module }}
          path: ${{ inputs.working-directory }}/coverage.out
          retention-days: 14

  shell:
    if: inputs.run-shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: .
          format: gcc

  image:
    if: inputs.run-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build image (no push)
        run: |
          if [ -n "${{ inputs.image-tag }}" ]; then
            docker build -t "${{ inputs.image-tag }}" "${{ inputs.image-context }}"
          else
            docker build "${{ inputs.image-context }}"
          fi
      - name: image extra validation (seed contract, digest pins)
        if: inputs.image-command != ''
        run: ${{ inputs.image-command }}

  boundary:
    if: inputs.run-boundary && inputs.boundary-command != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - name: boundary gate (caller hook)
        run: ${{ inputs.boundary-command }}
        working-directory: ${{ inputs.working-directory }}

  govulncheck:
    if: inputs.run-govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - name: Install govulncheck (org pin, never latest)
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ inputs.govulncheck-version }}
      - name: govulncheck (package mode is Go 1.26 SSA-safe)
        run: govulncheck -scan package ./...
        working-directory: ${{ inputs.working-directory }}

  gosec:
    if: inputs.run-gosec
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - name: Install gosec (org pin, never latest)
        run: go install github.com/securego/gosec/v2/cmd/gosec@${{ inputs.gosec-version }}
      - name: gosec scan (never blocking; findings ride the artifact)
        # gosec's bundled type-checker cannot fully load new Go generics
        # and exits non-zero even with zero findings: the lane itself never
        # fails, and scheduled runs opt into failure via
        # gosec-fail-on-findings so issue filing stays reachable. No
        # Security-tab upload: fork PRs run on a read-only token.
        run: gosec -fmt sarif -out "$GITHUB_WORKSPACE/gosec.sarif" ./... > "$GITHUB_WORKSPACE/gosec.log" 2>&1 || true
        working-directory: ${{ inputs.working-directory }}
      - name: finding count to summary
        run: |
          n=$(jq '[.runs[].results[]] | length' "$GITHUB_WORKSPACE/gosec.sarif")
          echo "## gosec findings: $n" >> "$GITHUB_STEP_SUMMARY"
          echo "gosec findings: $n"
      - name: fail on findings (scheduled runs only)
        if: inputs.gosec-fail-on-findings
        run: |
          n=$(jq '[.runs[].results[]] | length' "$GITHUB_WORKSPACE/gosec.sarif")
          if [ "${n:-0}" -gt 0 ]; then echo "gosec findings; failing to file the issue."; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gosec-${{ inputs.module }}
          path: |
            ${{ github.workspace }}/gosec.sarif
            ${{ github.workspace }}/gosec.log
          retention-days: 14

  actionlint:
    if: inputs.run-actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint (pinned, sha256-checked)
        env:
          ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
          ACTIONLINT_SHA256: ${{ inputs.actionlint-sha256 }}
        run: |
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/sg-actionlint.tar.gz
          echo "$ACTIONLINT_SHA256  /tmp/sg-actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sg-actionlint.tar.gz -C /tmp actionlint
      - name: Lint workflows
        run: /tmp/actionlint -no-color .github/workflows/*.yml

  ci-complete:
    needs: [lint, test, race, shell, image, boundary, govulncheck, gosec, actionlint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: aggregate (pass when needed lanes passed or legitimately skipped)
        run: |
          python3 - <<'EOF'
          import json, os
          # NEEDS_JSON is toJSON(needs): {job: {"result": ..., "outputs": ...}}.
          # NOTE: comparing whole job OBJECTS to "failure" never matches
          # (false-green); expanding needs.*.result gives a bare ARRAY that
          # kills green runs on AttributeError. Compare v["result"] instead.
          # Never change this shape without a seeded red proof.
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v.get("result") for k, v in needs.items()
                 if isinstance(v, dict) and v.get("result") in ("failure", "cancelled")}
          if bad:
              print("FAIL:", bad)
              raise SystemExit(1)
          print("ci-complete: pass (skips allowed)")
          EOF
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
