# Reusable Go collector CI — single-module lane bodies.
# Caller: .github/workflows/ci.yml in each collector repo (thin wrapper with
# paths-filter + job names identical to in-repo implementation).
# Versioned by tag on eshu-hq/.github (v1, then semver).
# Stable job names: lint, test, race, shell, image, govulncheck, gosec,
# ci-complete. Only ci-complete is ever required in a ruleset.
name: go-collector-ci (reusable)

on:
  workflow_call:
    inputs:
      module:
        description: Go module path being gated (informational).
        required: false
        default: .
        type: string
      working-directory:
        description: Directory holding go.mod for this module.
        required: false
        default: .
        type: string
      coverage-floor:
        description: Minimum total statement coverage percent; only rises.
        required: false
        default: 0
        type: number
      go-version:
        description: Go toolchain version.
        required: false
        default: "1.26.6"
        type: string
      run-image:
        description: Run the image lane (repo ships a Dockerfile).
        required: false
        default: false
        type: boolean
      run-lint:
        description: Set by caller paths-filter for Go/module changes.
        required: false
        default: true
        type: boolean
      run-test:
        description: Set by caller paths-filter for Go/fixture changes.
        required: false
        default: true
        type: boolean
      run-race:
        description: Set by caller paths-filter for Go/module changes.
        required: false
        default: true
        type: boolean
      run-shell:
        description: Set by caller paths-filter for shell changes.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  lint:
    if: inputs.run-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f883bedcfbabaeaed0a
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c24be8b25114
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
        working-directory: ${{ inputs.working-directory }}
      - name: vet
        run: go vet ./...
        working-directory: ${{ inputs.working-directory }}
      - name: lint (whole repo, no baseline)
        run: golangci-lint run ./...
        working-directory: ${{ inputs.working-directory }}
      - name: format check (gofumpt)
        run: golangci-lint fmt --diff ./...
        working-directory: ${{ inputs.working-directory }}
      - name: tidy check
        run: |
          go mod tidy -diff
          git diff --exit-code -- go.mod go.sum
        working-directory: ${{ inputs.working-directory }}
      - name: 500-line file cap (wc -l, sole static gate)
        run: |
          over=$(find . -name '*.go' -not -path './vendor/*' -exec wc -l {} + | awk '$1 > 500 {print}')
          if [ -n "$over" ]; then echo "$over"; echo "FAIL: .go files over 500 lines"; exit 1; fi
        working-directory: ${{ inputs.working-directory }}

  test:
    if: inputs.run-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f883bedcfbabaeaed0a
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c24be8b25114
        with:
          go-version: ${{ inputs.go-version }}
      - name: build
        run: go build ./...
        working-directory: ${{ inputs.working-directory }}
      - name: test
        run: go test ./... -count=1
        working-directory: ${{ inputs.working-directory }}

  race:
    if: inputs.run-race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f883bedcfbabaeaed0a
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c24be8b25114
        with:
          go-version: ${{ inputs.go-version }}
      - name: race + coverprofile
        run: go test ./... -race -count=1 -covermode=atomic -coverprofile=coverage.out
        working-directory: ${{ inputs.working-directory }}
      - name: coverage totals
        run: go tool cover -func=coverage.out | tail -n 30 >> "$GITHUB_STEP_SUMMARY"
        working-directory: ${{ inputs.working-directory }}
      - name: enforce floor
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "total=$total floor=${{ inputs.coverage-floor }}"
          awk -v t="$total" -v f="${{ inputs.coverage-floor }}" 'BEGIN { if (t + 0 < f + 0) { print "FAIL: coverage below floor"; exit 1 } }'
        working-directory: ${{ inputs.working-directory }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540e4489e45b6eb9f30b0b0df
        with:
          name: coverage-${{ inputs.module }}
          path: ${{ inputs.working-directory }}/coverage.out
          retention-days: 14

  shell:
    if: inputs.run-shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f883bedcfbabaeaed0a
      - name: shellcheck
        uses: ludeeus/action-shellcheck@f5b90e8bf0bd0a1f706a7d0a9e1a0b2d4db1d94a
        with:
          scandir: .

  image:
    if: inputs.run-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f883bedcfbabaeaed0a
      - name: build image (no push)
        run: docker build .

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f883bedcfbabaeaed0a
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c24be8b25114
        with:
          go-version: ${{ inputs.go-version }}
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        working-directory: ${{ inputs.working-directory }}

  gosec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f883bedcfbabaeaed0a
      - name: gosec SARIF (advisory)
        uses: securego/gosec@7de6dd13bb9d087e819e8583b555d2e5b876b3e
        with:
          args: -fmt sarif -out gosec.sarif ./...
      - uses: github/codeql-action/upload-sarif@31cb49c71c25ff73fb2e67bbf58bb10019c9160
        with:
          sarif_file: gosec.sarif
        continue-on-error: true

  ci-complete:
    needs: [lint, test, race, shell, image, govulncheck, gosec]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: aggregate (pass when needed lanes passed or legitimately skipped)
        run: |
          python3 - <<'EOF'
          import json, os
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v for k, v in needs.items() if v in ("failure", "cancelled")}
          if bad:
              print("FAIL:", bad)
              raise SystemExit(1)
          print("ci-complete: pass (skips allowed)")
          EOF
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
